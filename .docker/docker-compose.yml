services:
  postgres:
    image: postgres:16-alpine
    container_name: archway-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey-master:
    image: valkey/valkey:8.1-alpine
    container_name: archway-valkey-master
    command: ["valkey-server", "--port", "6379"]
    ports:
      - "6379:6379"
    volumes:
      - valkey_master_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey-replica:
    image: valkey/valkey:8.1-alpine
    container_name: archway-valkey-replica
    command: ["valkey-server", "--port", "6379", "--replicaof", "valkey-master", "6379"]
    depends_on:
      valkey-master:
        condition: service_healthy
    ports:
      - "6380:6379"
    volumes:
      - valkey_replica_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  valkey_master_data:
  valkey_replica_data:
